# The binary tools of the reusable workflows and of the checks, at exact versions. mise.lock holds
# the download URL and the sha256 checksum of each tool for each platform. `mise install --locked`
# installs them, and the checks run them with `mise exec --` (README.md, "Tools"). The reusable
# workflows pr-title.yml and k8s-validate.yml install their tools from the mise.toml and mise.lock of
# their own commit, so a caller gets the tool versions of its tag. The names are the short names of
# the mise registry, which the mise manager of Renovate can update. helm-unittest has no short name,
# so it comes from its GitHub release. To change a version, edit it here and run
# `mise lock --platform linux-x64,linux-arm64`.
[tools]
actionlint = "1.7.12"
gitleaks = "8.30.1"
"github:helm-unittest/helm-unittest" = "1.2.1"
helm = "4.3.2"
jq = "1.8.2"
kube-linter = "0.8.3"
kubeconform = "0.8.0"
kustomize = "5.8.3"
node = "26.13.1"
promtool = "3.16.0"
shellcheck = "0.11.0"
trivy = "0.76.2"
uv = "0.13.10"
yq = "4.54.3"
