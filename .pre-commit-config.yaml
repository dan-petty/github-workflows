# The checks of each commit. After `uv sync --frozen`, `.venv/bin/pre-commit install` installs the
# hook, once per clone. CI runs the same checks in .github/workflows/ci.yml. Renovate updates rev.
#
# no-commit-to-branch refuses a commit on main: each change goes through a pull request. The other
# hooks of pre-commit-hooks check the syntax of the YAML, JSON and TOML files, refuse a private key,
# a large file and a conflict marker, and write each line ending as LF with no trailing whitespace.
# The gitleaks hook runs the private-data guard on the staged changes, with the gitleaks of
# mise.toml. Set PRIVATE_DOMAINS (one domain on each line) in the environment to also refuse those
# domains (README.md, "Private-data guard").
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-yaml
        args: [--allow-multiple-documents]
        # The templates of a Helm chart are Go templates, not YAML.
        exclude: ^tests/fixtures/charts/[^/]+/templates/
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: gitleaks
        name: private-data guard (gitleaks)
        entry: mise exec -- scripts/private-data-scan.sh git --pre-commit --staged
        language: unsupported
        pass_filenames: false
