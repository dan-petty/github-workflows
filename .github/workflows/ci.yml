name: CI

# The checks of this repository, on each pull request, each push to main and each manual run. The
# job changes finds the tools whose files a change touches (dorny/paths-filter), and a check job runs
# only when its filter matches. A manual run (workflow_dispatch, Actions tab or
# `gh workflow run ci.yml`) runs every job. The private-data guard runs on each event, because a
# change to any file can add private data. Each job installs its tools from mise.toml and
# mise.lock, and the Python tools from uv.lock, as a local run does (README.md, "Checks").
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No tool of the jobs reports usage. mise exec runs only the tools that the job installed.
  DO_NOT_TRACK: "1"
  MISE_USE_VERSIONS_HOST_TRACK: "false"
  MISE_EXEC_AUTO_INSTALL: "false"
  # uv runs only its own CPython builds, never the Python of the runner image.
  UV_MANAGED_PYTHON: "1"

jobs:
  changes:
    name: Changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
      yaml: ${{ steps.filter.outputs.yaml }}
      actions: ${{ steps.filter.outputs.actions }}
      shell: ${{ steps.filter.outputs.shell }}
      template: ${{ steps.filter.outputs.template }}

    steps:
      # A pull request gives its files through the API. A push compares the commits with git.
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 20

      - name: Find the changed tools
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tools: &tools
              - .github/workflows/ci.yml
              - mise.toml
              - mise.lock
            python: &python
              - *tools
              - pyproject.toml
              - uv.lock
            k8s:
              - *tools
              - .github/workflows/k8s-validate.yml
              - .kube-linter.yaml
              - scripts/k8s-validate.sh
              - tests/test-k8s-validate.sh
              - tests/test-kube-linter-config.sh
              - tests/fixtures/**
            yaml:
              - *python
              - .yamllint.yaml
              - "**/*.yaml"
              - "**/*.yml"
            actions:
              - *tools
              - .github/workflows/**
              - .github/actionlint.yaml
              - scripts/pr-title-scopes.sh
              - tests/test-pr-title-scopes.sh
              - tests/test-ci-check-names.sh
            shell:
              - *tools
              - "**/*.sh"
            template:
              - *python
              - .github/workflows/pr-title.yml
              - .github/workflows/release.yml
              - .yamllint.yaml
              - copier.yml
              - templates/**
              - tests/test-repository-template.sh

  private-data:
    name: Private-data guard
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      - name: Install gitleaks
        timeout-minutes: 3
        run: mise install --locked gitleaks

      - name: Test the rules of the guard
        timeout-minutes: 3
        run: mise exec -- tests/test-private-data-scan.sh

      # The Actions secret PRIVATE_DOMAINS holds the real domains, one on each line. When it is not
      # set (or the pull request comes from a fork), the step writes a warning in the log and in the
      # job summary, and runs the rules of .gitleaks.toml only.
      - name: Scan the files for private data
        timeout-minutes: 3
        env:
          PRIVATE_DOMAINS: ${{ secrets.PRIVATE_DOMAINS }}
        run: mise exec -- scripts/private-data-scan.sh dir .

  # GitHub names the check of this job "K8s run / Validate" when it runs, and "K8s run" when it is
  # skipped, so a ruleset requires the job k8s below, not this one.
  k8s-validate:
    name: K8s run
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.k8s == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/k8s-validate.yml
    with:
      kustomize-roots: |
        tests/fixtures/k8s/tests/example
      helm-charts: |
        tests/fixtures/charts/example
      promtool-rules: |
        tests/fixtures/k8s/components/example/rules/example.rules.yaml

  # The one check of the Kubernetes validation that a ruleset can require. It always reports, and it
  # fails when the validation or the job changes failed or was cancelled
  # (tests/test-ci-check-names.sh).
  k8s:
    name: K8s
    needs: [changes, k8s-validate]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Report the result of the Kubernetes validation
        timeout-minutes: 2
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CALL_RESULT: ${{ needs.k8s-validate.result }}
        run: |
          echo "changes: $CHANGES_RESULT, validation: $CALL_RESULT"
          for result in "$CHANGES_RESULT" "$CALL_RESULT"; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done

  k8s-config:
    name: kube-linter config
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.k8s == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      - name: Install kube-linter
        timeout-minutes: 3
        run: mise install --locked kube-linter

      - name: Test the custom checks of .kube-linter.yaml
        timeout-minutes: 3
        run: mise exec -- tests/test-kube-linter-config.sh

  k8s-script:
    name: K8s script
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.k8s == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      - name: Install kustomize, yq, helm, kubeconform, trivy and kube-linter
        timeout-minutes: 3
        run: mise install --locked kustomize yq helm kubeconform trivy kube-linter

      # The test runs the steps of scripts/k8s-validate.sh on the fixtures of tests/fixtures/ and on
      # files that it writes: the render of a test chart and of each object to its own file, the
      # schema of a CRD, and the scope of each entry of a trivy and of a kube-linter ignore file
      # (tests/test-k8s-validate.sh).
      - name: Test scripts/k8s-validate.sh
        timeout-minutes: 5
        run: mise exec -- tests/test-k8s-validate.sh

  yaml:
    name: YAML
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.yaml == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      - name: Install uv and the Python tools of uv.lock
        timeout-minutes: 5
        run: |
          mise install --locked uv
          mise exec -- uv sync --frozen
          echo "$PWD/.venv/bin" >>"$GITHUB_PATH"

      - name: Run yamllint
        timeout-minutes: 2
        run: yamllint --strict .

      # zizmor checks the workflows: each action pinned to a commit SHA, no job with more
      # permissions than it needs and no `secrets: inherit`. The audits run offline, so the result
      # does not change with the GitHub API. .github/zizmor.yml holds the settings.
      - name: Run zizmor
        timeout-minutes: 2
        run: zizmor --offline .github/workflows/

  actions:
    name: actionlint
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.actions == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      - name: Install actionlint, shellcheck and yq
        timeout-minutes: 3
        run: mise install --locked actionlint shellcheck yq

      # actionlint also runs shellcheck on the script of each run step.
      - name: Run actionlint
        timeout-minutes: 2
        run: mise exec -- actionlint

      # The script gives the reusable workflow pr-title.yml the scopes of every repository and of the
      # labels file of the caller (tests/test-pr-title-scopes.sh).
      - name: Test scripts/pr-title-scopes.sh
        timeout-minutes: 2
        run: mise exec -- tests/test-pr-title-scopes.sh

      - name: Test the check names of ci.yml
        timeout-minutes: 2
        run: mise exec -- tests/test-ci-check-names.sh

  shell:
    name: shellcheck
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.shell == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      - name: Install shellcheck
        timeout-minutes: 3
        run: mise install --locked shellcheck

      - name: Run shellcheck
        timeout-minutes: 2
        run: git ls-files -z '*.sh' | xargs -0 mise exec -- shellcheck

  template:
    name: Repository template
    needs: changes
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.template == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.11.14"
          install: false
          cache: false

      - name: Install uv, Node, actionlint, shellcheck, jq and yq
        timeout-minutes: 3
        run: mise install --locked uv node actionlint shellcheck jq yq

      - name: Install the Python tools of uv.lock
        timeout-minutes: 5
        run: mise exec -- uv sync --frozen

      # The test renders the template with each answer set and checks the files with actionlint,
      # yamllint, tomllib, pre-commit, check-jsonschema and the config validator of Renovate
      # (tests/test-repository-template.sh). It also checks that this repository holds each reusable
      # workflow that a rendered caller calls. npx installs the Renovate release of the test, and
      # check-jsonschema downloads the release-please schemas of the test.
      - name: Render and check the template with each answer set
        timeout-minutes: 6
        run: mise exec -- tests/test-repository-template.sh
